name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate synthetic raw data
        run: python src/utils/generate_raw_data.py
      - name: Run unit tests (PySpark transform + data quality logic)
        run: pytest tests/ -v
      - name: Run full local pipeline (mocked S3 end-to-end)
        run: python src/local/run_pipeline.py
